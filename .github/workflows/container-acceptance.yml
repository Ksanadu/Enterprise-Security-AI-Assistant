name: Container acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install acceptance client
        run: python -m pip install 'httpx>=0.27,<0.29'
      - name: Run actual clean Compose and restart/fault acceptance
        run: python scripts/container-acceptance.py
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-acceptance
          path: logs/container-acceptance
          if-no-files-found: warn
